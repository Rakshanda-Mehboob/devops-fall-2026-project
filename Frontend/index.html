<!DOCTYPE html>
<html>
<head>
    <title>DevOps Project</title>
</head>
<body>

<h1>DevOps Project</h1>

<p id="message">Loading...</p>

<script>
fetch("http://localhost:5000/")
.then(response => response.json())
.then(data => {
    document.getElementById("message").innerText = data.message;
});
</script>

</body>
</html>
